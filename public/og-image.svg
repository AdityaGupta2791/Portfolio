<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117" />

  <!-- Decorative accent shapes (echoing Hero) -->
  <circle cx="120" cy="100" r="60" fill="#fb923c" opacity="0.18" />
  <rect x="60" y="500" width="80" height="80" rx="14" fill="#f97316" opacity="0.22" transform="rotate(12 100 540)" />
  <circle cx="1080" cy="540" r="70" fill="#fb923c" opacity="0.18" />
  <rect x="1050" y="80" width="90" height="90" rx="14" fill="#f97316" opacity="0.22" transform="rotate(-8 1095 125)" />

  <!-- Brand mark (top-left) -->
  <rect x="60" y="60" width="64" height="64" rx="14" fill="url(#markGrad)" />
  <text x="92" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="32" fill="#0d1117">AG</text>

  <!-- Greeting -->
  <text x="600" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="38" fill="#d1d5db">
    Hello<tspan fill="#f97316" font-weight="800">.</tspan>
  </text>

  <!-- Name -->
  <text x="600" y="340" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="84" fill="url(#nameGrad)">
    I’m Aditya Gupta
  </text>

  <!-- Role -->
  <text x="600" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="34" fill="#fb923c">
    Full-Stack Developer
  </text>

  <!-- Subtitle -->
  <text x="600" y="470" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="24" fill="#d1d5db">
    React · Node.js · Express · MongoDB
  </text>

  <!-- Footer URL -->
  <text x="600" y="580" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" fill="#9ca3af">
    aditya-gupta-portfolio.vercel.app
  </text>
</svg>
